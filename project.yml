name: XTermX
options:
  bundleIdPrefix: us.cassel.xtermx
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    DEVELOPMENT_TEAM: ""
    # Every bundle ID derives from this; Release/*.sh can override it for another Apple account.
    XTX_BUNDLE_PREFIX: us.cassel.xtermx
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  XTermXKit:
    path: Packages/XTermXKit
targets:
  XTermX-macOS:
    type: application
    platform: macOS
    sources: [Apps/macOS]
    dependencies:
      - package: XTermXKit
        product: XTermXKit
      - package: XTermXKit
        product: XTermXHost
      - package: XTermXKit
        product: XTermXTerminalUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(XTX_BUNDLE_PREFIX).mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: XTermX
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        # TCC attributes mic/camera use by shells/CLIs in our panes (e.g. hold-Space voice input) to XTermX;
        # without these entitlements and usage strings it is denied silently, with no prompt.
        # Release/mac-release.sh checks both are in the signed app.
        ENABLE_RESOURCE_ACCESS_AUDIO_INPUT: YES
        ENABLE_RESOURCE_ACCESS_CAMERA: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: XTermX
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: XTermX turns speech into text in the terminal you choose.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: XTermX lets the programs you run in a terminal use the microphone, for example for voice input.
        INFOPLIST_KEY_NSCameraUsageDescription: XTermX lets the programs you run in a terminal use the camera.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: XTermX lets your paired iPhone and Apple Watch reach the terminals on this Mac.
        INFOPLIST_KEY_NSDesktopFolderUsageDescription: XTermX runs the shell commands you type, which may read or write files on your Desktop.
        INFOPLIST_KEY_NSDocumentsFolderUsageDescription: XTermX runs the shell commands you type, which may read or write files in your Documents folder.
        INFOPLIST_KEY_NSDownloadsFolderUsageDescription: XTermX runs the shell commands you type, which may read or write files in your Downloads folder.
    info:
      path: Apps/macOS/Info.plist
      properties:
        NSBonjourServices: [_xtermx._tcp]
